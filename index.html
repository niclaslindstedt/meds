<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the app paint under the
         notch / home indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12101a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Nird Meds — a simple medication tracker</title>
    <meta
      name="description"
      content="Nird Meds is a local-first medication tracking PWA built for speed: add your medications and when to take them, then log each dose with one tap. A calendar and history show your adherence and the gaps. Your log stays on your device, and syncs to Dropbox or Google Drive only if you connect one."
    />
    <link rel="canonical" href="https://meds.niclaslindstedt.se/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Nird Meds — a simple medication tracker"
    />
    <meta
      property="og:description"
      content="A privacy-first medication tracker: enter your meds and their times, log each dose with one tap, and read your adherence history and calendar. No account, no server."
    />
    <meta property="og:url" content="https://meds.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://meds.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nird Meds — a simple medication tracker"
    />
    <meta
      name="twitter:description"
      content="A privacy-first medication tracker: enter your meds and their times, log each dose with one tap, and read your adherence history and calendar. No account, no server."
    />
    <meta
      name="twitter:image"
      content="https://meds.niclaslindstedt.se/og.png"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Nird Meds",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any",
        "description": "A local-first medication tracking PWA: enter your medications and when to take them, log each dose with one tap, and read your adherence history, calendar and stats. Optional Dropbox / Google Drive sync.",
        "url": "https://meds.niclaslindstedt.se/",
        "image": "https://meds.niclaslindstedt.se/og.png",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
